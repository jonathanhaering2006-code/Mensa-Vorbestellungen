<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensa Speiseplan & Vorbestellung</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            background: white;
        }

        .day-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .day-header {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .day-time-select {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            font-weight: normal;
        }

        .day-time-select select {
            padding: 5px 8px;
            border-radius: 4px;
            border: none;
            font-size: 0.95em;
            background: white;
            color: #333;
        }

        .meal-options {
            padding: 15px;
        }

        .meal-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .meal-item:last-child {
            border-bottom: none;
        }

        .meal-item:hover {
            background-color: #f9f9f9;
        }

        .meal-item input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .meal-details {
            flex-grow: 1;
        }

        .meal-title {
            font-weight: 600;
        }

        .meal-desc {
            font-size: 0.85em;
            color: #777;
        }

        .meal-nutrition {
            font-size: 0.8em;
            color: #e67e22;
            margin-top: 2px;
            font-weight: 500;
        }

        .meal-price {
            font-weight: bold;
            color: var(--accent);
        }

        .extras-section {
            background: #fdfefe;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .extras-section h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1em;
        }

        .extras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .extra-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .extra-item input[type="checkbox"] {
            transform: scale(1.2);
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #219150;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .user-info {
                grid-template-columns: 1fr;
            }
            .day-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mensa Speiseplan</h1>
    <p class="subtitle">Wähle deine Gerichte, individuelle Abholzeiten pro Tag und Extras.</p>

    <form id="orderForm">
        <!-- Benutzerdaten -->
        <div class="user-info">
            <div class="form-group">
                <label for="userName">Vollständiger Name *</label>
                <input type="text" id="userName" required placeholder="z. B. Max Mustermann">
            </div>
            <div class="form-group">
                <label for="userEmail">E-Mail-Adresse *</label>
                <input type="email" id="userEmail" required placeholder="max@beispiel.de">
            </div>
        </div>

        <!-- Dynamische Tage & Menüs -->
        <div id="menuContainer"></div>

        <!-- Extras -->
        <div class="extras-section">
            <h3>🥗 Zusätzliche Extras für die Woche</h3>
            <div class="extras-grid" id="extrasContainer"></div>
        </div>

        <!-- Zusammenfassung -->
        <div class="summary">
            <div>
                <span>Gesamtpreis: </span>
                <span class="total-price" id="totalPrice">0,00 €</span>
            </div>
            <button type="submit" id="submitBtn">Kostenpflichtig vorbestellen</button>
        </div>
        <div id="status-message"></div>
    </form>
</div>

<script>
    // **WICHTIG**: Google Apps Script Web-App URL hier eintragen!
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCFaq_Zriw_ulkfDvFFXA9-qNBFgUJrjGfl2itrSkCRS_Z3DYT0osPlohFzsyh1D1QIg/exec";

    // Zeiten-Optionen für die Abholung
    const abholZeitenOptions = ["11:30 Uhr", "11:45 Uhr", "12:00 Uhr", "12:15 Uhr", "12:30 Uhr", "12:45 Uhr", "13:00 Uhr", "13:15 Uhr", "13:30 Uhr", "13:45 Uhr", "14:00 Uhr"];

    // Automatisches Datum (Aktuelle Woche)
    function getWeekDates() {
        const today = new Date();
        const currentDay = today.getDay();
        const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
        
        const monday = new Date(today);
        monday.setDate(today.getDate() + distanceToMonday);

        const days = [];
        const dayNames = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
        const months = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

        for (let i = 0; i < 5; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            days.push({
                tag: dayNames[i],
                datum: `${d.getDate()}. ${months[d.getMonth()]}`
            });
        }
        return days;
    }

    const weekDates = getWeekDates();

    const speiseplan = [
        {
            tag: "Montag",
            angebote: [
                { id: "mo_1", name: "Menü 1: Spaghetti Bolognese", desc: "Rindfleischsauce mit Hartkäse", naehrwerte: "650 kcal | 28g Eiweiß | 75g KH | 22g Fett", preis: 4.50 },
                { id: "mo_2", name: "Menü 2: Gemüsegulasch (Veggie)", desc: "Mit Kartoffeln und Paprika", naehrwerte: "420 kcal | 12g Eiweiß | 60g KH | 14g Fett", preis: 4.00 },
                { id: "mo_none", name: "Kein Essen", desc: "Ich benötige montags kein Essen", naehrwerte: "-", preis: 0.00 }
            ]
        },
        {
            tag: "Dienstag",
            angebote: [
                { id: "di_1", name: "Menü 1: Hähnchenbrust im Knuspermantel", desc: "Mit Pommes und Salat", naehrwerte: "720 kcal | 45g Eiweiß | 65g KH | 28g Fett", preis: 5.20 },
                { id: "di_2", name: "Menü 2: Spinat-Linsen-Curry (Vegan)", desc: "Mit Basmatireis", naehrwerte: "480 kcal | 18g Eiweiß | 70g KH | 12g Fett", preis: 4.20 },
                { id: "di_none", name: "Kein Essen", desc: "Ich benötige dienstags kein Essen", naehrwerte: "-", preis: 0.00 }
            ]
        },
        {
            tag: "Mittwoch",
            angebote: [
                { id: "mi_1", name: "Menü 1: Schweineschnitzel 'Wiener Art'", desc: "Mit Bratkartoffeln", naehrwerte: "780 kcal | 40g Eiweiß | 70g KH | 35g Fett", preis: 5.00 },
                { id: "mi_2", name: "Menü 2: Käsespätzle", desc: "Mit Röstzwiebeln und Beilagensalat", naehrwerte: "610 kcal | 22g Eiweiß | 68g KH | 26g Fett", preis: 4.50 },
                { id: "mi_none", name: "Kein Essen", desc: "Ich benötige mittwochs kein Essen", naehrwerte: "-", preis: 0.00 }
            ]
        },
        {
            tag: "Donnerstag",
            angebote: [
                { id: "do_1", name: "Menü 1: Lasagne al Forno", desc: "Mit Hackfleisch und Béchamel", naehrwerte: "700 kcal | 32g Eiweiß | 62g KH | 30g Fett", preis: 5.00 },
                { id: "do_2", name: "Menü 2: Falafel-Bowl (Vegan)", desc: "Mit Couscous, Hummus und Gemüse", naehrwerte: "510 kcal | 16g Eiweiß | 74g KH | 15g Fett", preis: 4.50 },
                { id: "do_none", name: "Kein Essen", desc: "Ich benötige donnerstags kein Essen", naehrwerte: "-", preis: 0.00 }
            ]
        },
        {
            tag: "Freitag",
            angebote: [
                { id: "fr_1", name: "Menü 1: Knuspriges Fischfilet", desc: "Mit Kartoffelsalat und Remoulade", naehrwerte: "660 kcal | 35g Eiweiß | 58g KH | 29g Fett", preis: 5.50 },
                { id: "fr_2", name: "Menü 2: Cremiges Pilz-Risotto", desc: "Mit frischem Parmesan und Kräutern", naehrwerte: "530 kcal | 14g Eiweiß | 72g KH | 18g Fett", preis: 4.20 },
                { id: "fr_none", name: "Kein Essen", desc: "Ich benötige freitags kein Essen", naehrwerte: "-", preis: 0.00 }
            ]
        }
    ];

    const extrasListe = [
        { id: "ex_salat", name: "Beilagensalat (frisch)", preis: 1.80 },
        { id: "ex_dessert", name: "Dessert / Süßspeise", preis: 1.50 },
        { id: "ex_getraenk", name: "Getränk 0,5l (Wasser / Apfelschorle)", preis: 2.00 }
    ];

    const menuContainer = document.getElementById('menuContainer');
    const extrasContainer = document.getElementById('extrasContainer');
    const totalPriceEl = document.getElementById('totalPrice');
    const orderForm = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('status-message');

    function renderMenu() {
        speiseplan.forEach((tagData, dayIndex) => {
            const datumStr = weekDates[dayIndex] ? weekDates[dayIndex].datum : "";
            const dayCard = document.createElement('div');
            dayCard.className = 'day-card';

            // Abholzeiten-Dropdown generieren
            let timeOptionsHTML = `<option value="Keine Abholung">Keine Abholung</option>`;
            abholZeitenOptions.forEach(zeit => {
                timeOptionsHTML += `<option value="${zeit}">${zeit}</option>`;
            });

            let optionsHTML = '';
            tagData.angebote.forEach((angebot, optIndex) => {
                const isChecked = optIndex === tagData.angebote.length - 1 ? 'checked' : '';
                optionsHTML += `
                    <label class="meal-item">
                        <input type="radio" 
                               name="day_${dayIndex}" 
                               value="${angebot.name}" 
                               data-price="${angebot.preis}" 
                               data-day="${tagData.tag}"
                               data-dayindex="${dayIndex}"
                               ${isChecked} 
                               onchange="handleMealChange(${dayIndex}, '${angebot.name}')">
                        <div class="meal-details">
                            <div class="meal-title">${angebot.name}</div>
                            <div class="meal-desc">${angebot.desc}</div>
                            <div class="meal-nutrition">📊 ${angebot.naehrwerte}</div>
                        </div>
                        <div class="meal-price">${angebot.preis.toFixed(2).replace('.', ',')} €</div>
                    </label>
                `;
            });

            dayCard.innerHTML = `
                <div class="day-header">
                    <span>${tagData.tag} (${datumStr})</span>
                    <div class="day-time-select">
                        <label for="time_${dayIndex}">🕒 Abholzeit:</label>
                        <select id="time_${dayIndex}" data-day="${tagData.tag}">
                            ${timeOptionsHTML}
                        </select>
                    </div>
                </div>
                <div class="meal-options">${optionsHTML}</div>
            `;
            menuContainer.appendChild(dayCard);
        });

        // Extras rendern
        extrasListe.forEach(extra => {
            const div = document.createElement('div');
            div.className = 'extra-item';
            div.innerHTML = `
                <input type="checkbox" name="extra" value="${extra.name}" data-price="${extra.preis}" onchange="calculateTotal()">
                <div>
                    <div style="font-weight:600; font-size:0.9em;">${extra.name}</div>
                    <div style="font-size:0.8em; color:var(--accent);">+${extra.preis.toFixed(2).replace('.', ',')} €</div>
                </div>
            `;
            extrasContainer.appendChild(div);
        });
    }

    // Wenn "Kein Essen" gewählt wird, Zeit auf "Keine Abholung" setzen, sonst Standard 12:00
    function handleMealChange(dayIndex, mealName) {
        const timeSelect = document.getElementById(`time_${dayIndex}`);
        if (mealName === "Kein Essen") {
            timeSelect.value = "Keine Abholung";
        } else if (timeSelect.value === "Keine Abholung") {
            timeSelect.value = "12:00 Uhr";
        }
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
            total += parseFloat(radio.getAttribute('data-price'));
        });
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(chk => {
            total += parseFloat(chk.getAttribute('data-price'));
        });
        totalPriceEl.textContent = total.toFixed(2).replace('.', ',') + ' €';
    }

    orderForm.addEventListener('submit', function(e) {
        e.preventDefault();

        if (GOOGLE_SCRIPT_URL === "HIER_DEINE_GOOGLE_APPS_SCRIPT_URL_EINFUEGEN") {
            alert("Bitte trage deine Google Apps Script URL im Code ein!");
            return;
        }

        submitBtn.disabled = true;
        statusMessage.style.color = "blue";
        statusMessage.textContent = "Bestellung wird gesendet...";

        let selectedExtrasArr = [];
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(chk => {
            selectedExtrasArr.push(chk.value);
        });

        const payload = {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            gesamtpreis: totalPriceEl.textContent,
            bestellungen: {},
            extras: selectedExtrasArr.length > 0 ? selectedExtrasArr.join(', ') : "Keine"
        };

        // Essen + Zeit pro Tag einsammeln
        document.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
            const day = radio.getAttribute('data-day');
            const dayIndex = radio.getAttribute('data-dayindex');
            const timeSelect = document.getElementById(`time_${dayIndex}`);
            
            payload.bestellungen[day] = {
                essen: radio.value,
                zeit: timeSelect ? timeSelect.value : "Keine Abholung"
            };
        });

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMessage.style.color = "green";
            statusMessage.textContent = "Vielen Dank! Deine Vorbestellung wurde erfolgreich übermittelt.";
            orderForm.reset();
            calculateTotal();
            submitBtn.disabled = false;
        })
        .catch(error => {
            console.error('Fehler:', error);
            statusMessage.style.color = "red";
            statusMessage.textContent = "Fehler beim Senden. Bitte versuche es erneut.";
            submitBtn.disabled = false;
        });
    });

    renderMenu();
    calculateTotal();
</script>

</body>
</html>
